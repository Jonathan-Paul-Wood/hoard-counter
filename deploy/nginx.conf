server {
    listen 8080;
    server_name _;
    client_max_body_size 100m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # The deploy command creates this sentinel before stopping the API.
    error_page 503 /maintenance.html;
    location = /maintenance.html {
        internal;
        default_type text/html;
        return 503 '<!doctype html><html><meta name="viewport" content="width=device-width"><title>Hoard Counter</title><body style="font:18px system-ui;max-width:40rem;margin:12vh auto;padding:2rem"><h1>Brief maintenance</h1><p>Hoard Counter is updating. Your information is safely stored. Please try again shortly.</p></body></html>';
    }
    location /api/ {
        if (-f /state/.maintenance) { return 503; }
        set $api http://api:5000;
        proxy_pass $api$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }
    location / {
        if (-f /state/.maintenance) { return 503; }
        set $web http://web:3000;
        proxy_pass $web$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
