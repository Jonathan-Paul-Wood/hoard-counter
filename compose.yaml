name: hoard-counter

services:
  api:
    image: ${IMAGE_PREFIX:-hoard-counter}-api:${APP_VERSION:?Set an immutable APP_VERSION}
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      APP_VERSION: ${APP_VERSION}
      DATABASE_URL: sqlite:////data/hoardcounter.db
      DATA_DIR: /data
      UPLOAD_DIR: /uploads
      BACKUP_DIR: /backups
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      HOUSEHOLD_TIMEZONE: ${HOUSEHOLD_TIMEZONE:-America/New_York}
    volumes:
      - ${WHC_DATA_ROOT:-/srv/hoard-counter}/data:/data
      - ${WHC_DATA_ROOT:-/srv/hoard-counter}/uploads:/uploads
      - ${WHC_DATA_ROOT:-/srv/hoard-counter}/backups:/backups
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 15s

  web:
    image: ${IMAGE_PREFIX:-hoard-counter}-web:${APP_VERSION:?Set an immutable APP_VERSION}
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_URL: http://api:5000
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 15s

  proxy:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    restart: unless-stopped
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${WHC_DATA_ROOT:-/srv/hoard-counter}/data:/state:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
