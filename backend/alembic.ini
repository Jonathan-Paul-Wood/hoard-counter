[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
timezone = UTC
file_template = %%(year)04d-%%(month)02d-%%(day)02d-%%(hour)02d-%%(minute)02d-%%(second)02d00-%%(slug)s
sqlalchemy.url = sqlite:///data/hoardcounter.db

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
